<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>$title</title>
<style>
:root { --bg: #faf8f4; --fg: #1d1d1f; --muted: #5f5f66; --accent: #2b3a55; --card: #fff; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #16171b; --fg: #ecebe8; --muted: #a3a3ab; --accent: #8fa6d6; --card: #202127; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
nav { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; }
nav label { cursor: pointer; font-size: 14px; color: var(--muted); padding: 4px 10px;
  border: 1px solid currentColor; border-radius: 999px; }
#l-pt:checked ~ nav label[for=l-pt], #l-en:checked ~ nav label[for=l-en] { color: var(--accent); font-weight: 600; }
#l-pt:checked ~ main .lang-en, #l-en:checked ~ main .lang-pt { display: none; }
main { max-width: 560px; margin: 0 auto; padding: 8px 16px 32px; }
.cover { display: block; width: 60%; max-width: 240px; height: auto; margin: 8px auto 24px;
  border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 8px; }
.subtitle { color: var(--muted); margin: 0 0 4px; font-size: 1.1rem; }
.author { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
ul { list-style: none; padding: 0; margin: 0 0 24px; }
li { background: var(--card); padding: 12px 14px; border-radius: 8px; margin-bottom: 8px;
  border-left: 4px solid var(--accent); }
.price { font-size: 1.5rem; font-weight: 700; margin: 0 0 12px; }
.price small { font-size: .9rem; font-weight: 400; color: var(--muted); margin-right: 6px; }
.buy { display: block; width: 100%; text-align: center; padding: 14px; font: inherit; font-weight: 600;
  border: 0; border-radius: 10px; background: var(--accent); color: var(--bg); text-decoration: none; }
.buy:disabled { opacity: .55; cursor: not-allowed; }
footer { text-align: center; color: var(--muted); font-size: .85rem; padding: 16px; }
@media (min-width: 720px) { h1 { font-size: 2.4rem; } }
</style>
</head>
<body>
<input type="radio" name="lang" id="l-pt" hidden$pt_checked>
<input type="radio" name="lang" id="l-en" hidden$en_checked>
<nav>$toggles</nav>
<main>
$cover
$blocks
</main>
</body>
</html>
